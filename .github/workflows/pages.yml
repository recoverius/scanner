name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          # A new cache name per deploy makes installed apps pick up the update.
          sed -i "s/paperwise-v1/paperwise-${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
